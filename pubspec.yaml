name: aura_walk
description: "An innovative Flutter app combining environmental sound analysis, weather data, and AR to create unique visual aura experiences."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  # flutter_sound: ^9.2.13  # Temporarily disabled for web compatibility
  # tflite_flutter: ^0.10.3  # Temporarily disabled for web compatibility
  # ar_flutter_plugin: ^0.7.2  # Temporarily disabled for web compatibility
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^1.10.7
  http: ^1.2.1
  flutter_dotenv: ^5.1.0
  # permission_handler: ^10.4.5  # Temporarily disabled for web compatibility

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - .env
